<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>BA Toolkit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232F4FD8'/%3E%3Cpath d='M8 22h16M8 16h10M8 10h13' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2F4FD8">
<style>
:root{
  --bg:#F6F7FB; --panel:#ffffff; --ink:#1A1F33; --muted:#5B6178; --line:#DDE1EC;
  --accent:#2F4FD8; --accent-soft:#E4E9FC; --accent-ink:#ffffff; --warm:#B7700A; --warm-soft:#FCEFD6;
  --d-box:#ffffff; --d-fill:#E4E9FC; --d-fill2:#FCEFD6; --d-stroke:#2F4FD8; --d-text:#1A1F33; --d-muted:#5B6178; --d-line:#6B7390;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121521; --panel:#1A1E2D; --ink:#E8EAF3; --muted:#A0A6BC; --line:#2C3247;
    --accent:#93A8FF; --accent-soft:#242C55; --accent-ink:#0E1022; --warm:#F2B84B; --warm-soft:#3A2E15;
    --d-box:#1A1E2D; --d-fill:#242C55; --d-fill2:#3A2E15; --d-stroke:#93A8FF; --d-text:#E8EAF3; --d-muted:#A0A6BC; --d-line:#8A90A8;
  }
}
:root[data-theme="dark"]{
  --bg:#121521; --panel:#1A1E2D; --ink:#E8EAF3; --muted:#A0A6BC; --line:#2C3247;
  --accent:#93A8FF; --accent-soft:#242C55; --accent-ink:#0E1022; --warm:#F2B84B; --warm-soft:#3A2E15;
  --d-box:#1A1E2D; --d-fill:#242C55; --d-fill2:#3A2E15; --d-stroke:#93A8FF; --d-text:#E8EAF3; --d-muted:#A0A6BC; --d-line:#8A90A8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 20px}
.brand{font-weight:700;letter-spacing:.2px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:22px;height:22px;border-radius:6px;background:var(--accent)}
.search{flex:1;max-width:340px;margin-left:auto;position:relative}
.search input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.results{position:absolute;top:110%;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:60vh;overflow:auto;display:none}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer}
.results button:hover,.results button:focus{background:var(--accent-soft)}
.results small{color:var(--muted);display:block}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 14px;scrollbar-width:thin}
nav.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button .n{font-size:12px;opacity:.7;margin-right:4px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1240px;margin:0 auto}
aside{border-right:1px solid var(--line);padding:18px 10px;position:sticky;top:96px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 10px 8px}
aside button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--ink)}
aside button:hover{background:var(--accent-soft)}
aside button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.mobile-pick{display:none}
main{padding:26px 34px 60px;min-width:0}
.crumb{color:var(--muted);font-size:13px;margin-bottom:2px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px}
.lede{font-size:17px;color:var(--ink);margin:0 0 18px;max-width:68ch}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.diagram svg{width:100%;height:auto;display:block}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actions button{border:1px solid var(--line);background:var(--bg);padding:6px 11px;border-radius:8px;cursor:pointer;font-size:13.5px}
.actions button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
ol.steps{margin:0;padding-left:20px}
ol.steps li{margin:4px 0}
.when{margin:0 0 14px}
.tip{background:var(--warm-soft);border-left:3px solid var(--warm);padding:10px 12px;border-radius:6px;margin-top:14px}
.tip b{color:var(--warm)}
table.tpl{border-collapse:collapse;width:100%;font-size:13px;margin-top:4px}
table.tpl th,table.tpl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.tpl th{background:var(--accent-soft)}
.tplwrap{overflow-x:auto}
.overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px}
.overview button{display:flex;flex-direction:column;justify-content:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.overview button:hover{border-color:var(--accent)}
.overview b{display:block;margin-bottom:2px}
.overview span{color:var(--muted);font-size:13.5px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.pager button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;cursor:pointer;max-width:48%}
footer{color:var(--muted);font-size:12.5px;padding:18px 34px 30px;max-width:1240px;margin:0 auto;border-top:1px solid var(--line)}
/* diagram classes */
.dg .bx{fill:var(--d-box);stroke:var(--d-stroke);stroke-width:1.5}
.dg .f1{fill:var(--d-fill);stroke:var(--d-stroke);stroke-width:1.5}
.dg .f2{fill:var(--d-fill2);stroke:var(--d-stroke);stroke-width:1.5}
.dg .ln{stroke:var(--d-line);stroke-width:1.5;fill:none}
.dg .dash{stroke:var(--d-line);stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.dg .ah{fill:var(--d-line)}
.dg text{fill:var(--d-text);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.dg text.h{font-weight:700}
.dg text.s{font-size:11.5px;fill:var(--d-muted)}
.dg text.big{font-size:22px;font-weight:700;fill:var(--d-stroke)}
@media (max-width:1100px){
  .grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .bar{padding:10px 16px;flex-wrap:wrap}
  .search{order:3;max-width:none;flex-basis:100%}
  .wrap{grid-template-columns:1fr}
  aside{display:none}
  .mobile-pick{display:block;margin:0 0 14px}
  .mobile-pick select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit}
  main{padding:18px 16px 50px}
  footer{padding:16px}
  h1{font-size:24px}
}
@media print{
  header,aside,.actions,.pager,.mobile-pick,footer{display:none!important}
  .wrap{display:block}
  main{padding:0}
  body{background:#fff;color:#000}
  .card{break-inside:avoid;border-color:#ccc}
  .printall section{break-after:page}
}
</style>
<script>
window.RIPPLE_CFG = {"mode": "header", "lines": ["As a <user> I want <goal> so that <value>", "MUST | SHOULD | COULD | WON'T", "R A C I", "Given <context> When <event> Then <outcome>", "AS-IS -> TO-BE", "gap = toBe - asIs", "stakeholders.map(power, interest)", "S W O T", "P E S T L E", "C A T W O E", "why(why(why(why(why(problem)))))", "BR-014: shall", "UC-07 <<include>> Validate", "actor -> system : request", "KPI >= target", "[ ] signed off"], "ink": "--accent", "glow": "--accent", "base": 0.11, "peak": 0.95};
// Code ripple: faint lines of code behind the page; a click sends a ragged, branching wave out through them.
// RIPPLE_CFG is set just above this script: { mode: "page" | "header", lines: [...], base, glow }.
(function(){
  const C = window.RIPPLE_CFG, GLYPHS = "01<>{}[]/=+*#;:.~", still = matchMedia("(prefers-reduced-motion: reduce)");
  const cv = document.createElement("canvas"), ctx = cv.getContext("2d"), layer = document.createElement("canvas"), lctx = layer.getContext("2d");
  cv.setAttribute("aria-hidden", "true");
  cv.style.cssText = (C.mode === "page" ? "position:fixed;" : "position:absolute;") + "inset:0;width:100%;height:100%;z-index:-1;pointer-events:none";
  let host, rows = [], cw = 8, lh = 18, W = 0, H = 0, dpr = 1, waves = [], raf = 0;
  const FONT = '12.5px "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace';
  const colour = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || "#888";

  function layout(){
    const r = C.mode === "page" ? { width: innerWidth, height: innerHeight } : host.getBoundingClientRect();
    W = Math.ceil(r.width); H = Math.ceil(r.height); dpr = Math.min(devicePixelRatio || 1, 2);
    if (!W || !H) return;   // not laid out yet; the resize observer tries again
    for (const c of [cv, layer]) { c.width = W * dpr; c.height = H * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = lctx.font = FONT; ctx.textBaseline = lctx.textBaseline = "top";
    cw = ctx.measureText("M").width;
    const cols = Math.ceil(W / cw) + 1, n = Math.ceil(H / lh) + 1;
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;   // same pattern every load
    rows = [];
    for (let i = 0; i < n; i++) {
      let s = "";
      while (s.length < cols) {
        if (rnd() < 0.18) { s += " ".repeat(6 + (rnd() * 30 | 0)); continue; }           // breathing gaps
        s += " ".repeat(rnd() * 5 | 0) + C.lines[rnd() * C.lines.length | 0] + "   ";
      }
      rows.push(s.slice(0, cols));
    }
    paintBase();
  }

  function paintBase(){
    lctx.clearRect(0, 0, W, H);
    lctx.globalAlpha = C.base; lctx.fillStyle = colour(C.ink);
    rows.forEach((s, i) => lctx.fillText(s, 0, i * lh + 3));
    frame(performance.now());
  }

  // Smooth 2D value noise, layered (fbm), so a wavefront frays like a coastline instead of a clean circle.
  const hash = (x, y) => { const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); };
  function noise(x, y){
    const xi = Math.floor(x), yi = Math.floor(y), u = (x - xi) ** 2 * (3 - 2 * (x - xi)), v = (y - yi) ** 2 * (3 - 2 * (y - yi));
    const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  const fbm = (x, y) => noise(x, y) * 0.55 + noise(x * 2.1 + 5, y * 2.1) * 0.3 + noise(x * 4.3, y * 4.3 + 9) * 0.15;

  // A wave: a lumpy outline (integer angular harmonics, amplitude falling with frequency) that
  // seeds smaller, lumpier waves along its front as it goes, which seed smaller ones again.
  function wave(x, y, reach, depth){
    const harm = [];
    let sum = 0;
    for (let k = 2 + (Math.random() * 2 | 0), amp = 0.16 + depth * 0.05; k < 48; k = Math.ceil(k * (1.7 + Math.random() * 0.6)), amp *= 0.55) {
      const a = amp * (0.5 + Math.random()); harm.push([k, a, Math.random() * 6.283, (Math.random() - 0.5) * 3]); sum += a;
    }
    const kids = depth < 3 ? Math.round((3 - depth) * (1 + Math.random() * 1.4)) : 0;
    return { x, y, reach, depth, harm, sum, kids, born: 0, t: performance.now(), life: 650 + reach * 1.25,
             band: 18 + reach * 0.03 + Math.random() * 12, seed: Math.random() * 99, next: 0.1 + Math.random() * 0.15 };
  }
  const radius = (w, r, th, age) => { let f = 1; for (const [k, a, p, sp] of w.harm) f += a * Math.sin(k * th + p + sp * age); return r * f; };

  function frame(now){
    raf = 0;
    ctx.clearRect(0, 0, W, H);
    if (W && H) ctx.drawImage(layer, 0, 0, W, H);
    waves = waves.filter((w) => now - w.t < w.life);
    if (!waves.length || !W) return;
    ctx.fillStyle = colour(C.glow);
    for (const w of [...waves]) {
      const age = (now - w.t) / w.life, r = Math.sqrt(age) * w.reach, band = w.band, fade = (1 - age) ** 1.4 * (1 - w.depth * 0.14);
      // Branch: a child starts somewhere on the current front and heads off on its own.
      while (w.born < w.kids && age > w.next && waves.length < 48) {
        const th = Math.random() * 6.283, rr = radius(w, r, th, age);
        waves.push(wave(w.x + Math.cos(th) * rr, w.y + Math.sin(th) * rr, w.reach * (0.22 + Math.random() * 0.28), w.depth + 1));
        w.born++; w.next += (0.55 / w.kids) * (0.6 + Math.random() * 0.8);
      }
      const rMax = r * (1 + w.sum) + band * 2, rMin = r * (1 - w.sum) - band * 2;
      const x0 = Math.max(0, w.x - rMax), x1 = Math.min(W, w.x + rMax);
      for (let i = Math.max(0, (w.y - rMax) / lh | 0); i < rows.length && i * lh < w.y + rMax; i++) {
        const s = rows[i], cy = i * lh + 3 + lh / 2;
        for (let j = x0 / cw | 0; j < s.length && j * cw < x1; j++) {
          if (s[j] === " ") continue;
          const px = j * cw + cw / 2, dx = px - w.x, dy = cy - w.y, d = Math.hypot(dx, dy);
          if (d > rMax || d < rMin) continue;
          const n = fbm(px / 70 + w.seed, cy / 70 + age * 0.8);
          const k = 1 - Math.abs(d + (n - 0.5) * band * 2.2 - radius(w, r, Math.atan2(dy, dx), age)) / band;
          if (k <= 0) continue;
          const e = k * k * fade * (0.25 + 1.1 * n), push = e * 6 / (d || 1);
          ctx.globalAlpha = Math.min(1, e * C.peak);
          ctx.fillText(Math.random() < e * 0.4 ? GLYPHS[Math.random() * GLYPHS.length | 0] : s[j], px - cw / 2 + dx * push, i * lh + 3 + dy * push);
        }
      }
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  }

  function ripple(e){
    if (still.matches || e.button > 0 || e.target.closest?.("input,textarea,select,[contenteditable]")) return;
    const r = C.mode === "page" ? { left: 0, top: 0 } : host.getBoundingClientRect();
    waves.push(wave(e.clientX - r.left, e.clientY - r.top, Math.hypot(W, H) * (C.mode === "page" ? 0.55 : 0.8), 0));
    if (waves.length > 48) waves.splice(0, waves.length - 48);
    if (!raf) raf = requestAnimationFrame(frame);
  }

  function attach(){
    host = C.mode === "page" ? document.body : document.querySelector(C.mode);
    if (!host) return false;
    if (!cv.isConnected) host.prepend(cv);
    layout();
    (C.mode === "page" ? document : host).addEventListener("pointerdown", ripple, { passive: true });
    return true;
  }

  function start(){
    if (C.mode === "page") {
      attach();
      // An unlock screen may swap the whole body out; put the canvas back when it does.
      new MutationObserver(() => { if (!cv.isConnected) document.body.prepend(cv); }).observe(document.body, { childList: true });
    } else if (!attach()) {
      const mo = new MutationObserver(() => { if (attach()) mo.disconnect(); });
      mo.observe(document.body, { childList: true, subtree: true });
    }
    let t; const again = () => { clearTimeout(t); t = setTimeout(() => host && layout(), 150); };
    addEventListener("resize", again);
    new ResizeObserver(again).observe(C.mode === "page" ? document.documentElement : document.body);
    // Re-colour when the light/dark theme changes.
    new MutationObserver(() => host && paintBase()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => host && paintBase());
    if (document.fonts) document.fonts.ready.then(() => host && layout());
  }
  document.readyState === "loading" ? document.addEventListener("DOMContentLoaded", start) : start();
})();
</script>
</head>
<body>
<div id="lock" style="min-height:100vh;display:grid;place-items:center;padding:16px">
  <form id="unlock" class="card" style="width:100%;max-width:360px">
    <div class="brand" style="margin-bottom:14px"><i></i>BA Toolkit</div>
    <label for="pw" style="display:block;color:var(--muted);font-size:13.5px;margin-bottom:6px">Passphrase</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit">
    <label style="display:flex;gap:8px;align-items:center;margin:12px 0;font-size:13.5px;color:var(--muted)"><input id="remember" type="checkbox" checked> Remember on this device</label>
    <div class="actions" style="margin-top:0"><button class="primary" type="submit">Unlock</button></div>
    <p id="msg" style="color:var(--warm);font-size:13.5px;min-height:1.2em;margin:10px 0 0"></p>
  </form>

const store = { get(k){try{return localStorage.getItem(k)}catch(_){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(_){}}, del(k){try{localStorage.removeItem(k)}catch(_){}} };
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlockWith(pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", hash:"SHA-256", salt:bytes(VAULT.salt), iterations:VAULT.iter }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const p = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name:"AES-GCM", iv:bytes(VAULT.iv) }, key, bytes(VAULT.ct))));
  document.getElementById("lock").remove();
  document.body.insertAdjacentHTML("afterbegin", p.html);
  const s = document.createElement("script"); s.textContent = p.js; document.body.appendChild(s);
}
const msg = document.getElementById("msg");
document.getElementById("unlock").addEventListener("submit", async e => {
  e.preventDefault(); const pw = document.getElementById("pw").value, keep = document.getElementById("remember").checked; msg.textContent = "Unlocking…";
  try { await unlockWith(pw); if (keep) store.set("ba-pass", pw); }
  catch(_) { msg.textContent = "That passphrase didn\u2019t work."; }
});
const saved = store.get("ba-pass");
if (saved) unlockWith(saved).catch(() => store.del("ba-pass"));
